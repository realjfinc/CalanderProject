name: Deploy Cloud Functions

# Deploys functions/ to the live calander-1025b project whenever it
# changes on main -- see DEPLOYMENT.md for one-time setup (the
# FIREBASE_FUNCTIONS_DEPLOY_SERVICE_ACCOUNT secret this needs, and the
# ANTHROPIC_API_KEY secret extractEvent already required in the Firebase
# console independent of this workflow).
#
# A dedicated service account, not the same one deploy-firebase-rules.yml
# uses: deploying functions means running arbitrary code with real data
# access, a meaningfully bigger blast radius than "can rewrite security
# rules" -- see that workflow's own comment on why these stay separate.
#
# Deliberately never triggers on pull_request, for the same reason as
# deploy-firebase-rules.yml: a PR's code must never run with access to a
# secret that can deploy to production. Only a push already on main, or
# an explicit manual run, can deploy.

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.30.0

      - name: Write deploy credentials
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-functions-deploy-key.json"
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_FUNCTIONS_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy Cloud Functions
        working-directory: .
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-functions-deploy-key.json
        run: firebase deploy --only functions --project calander-1025b --non-interactive

      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-functions-deploy-key.json"
